# .github/workflows/labeler.yml
name: "Pull Request Labeler"
on:
  pull_request_target: # This trigger is generally safer for labeler actions
    types:
      - opened
      - reopened
      - synchronize

permissions: read-all

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # The action automatically looks for .github/labels.yml by default
